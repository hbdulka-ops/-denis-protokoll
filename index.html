<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denis Protokoll</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>Denis Protokoll</h1>
        <span id="connection-status" class="status-online">Online</span>
    </header>

    <main class="app-container">
        
        <section class="report-form-section">
            <h2>Neuen Bericht erstellen</h2>
            
            <form id="report-form">
                <div class="form-group">
                    <label for="report-area">Bereich / Objekt:</label>
                    <input type="text" id="report-area" required placeholder="z.B. Haupttor, Lager...">
                </div>

                <div class="form-group">
                    <label for="report-type">Ereignis:</label>
                    <select id="report-type" required>
                        <option value="">-- Bitte wählen --</option>
                        <option value="Kontrollgang">Kontrollgang (جولة تفتيشية)</option>
                        <option value="Vorkommnis">Besonderes Vorkommnis (حدث خاص)</option>
                        <option value="Meldung">Meldung / Defekt (بلاغ / عطل)</option>
                        <option value="Schlüsselübergabe">Schlüsselübergabe (تسليم مفاتيح)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="report-description">Beschreibung:</label>
                    <textarea id="report-description" rows="5" required placeholder="Details zum Vorfall eingeben..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Bericht Speichern</button>
            </form>
        </section>

        <hr>

        <section class="reports-list-section">
            <h2>Gespeicherte Berichte</h2>
            <div id="reports-container">
                <p class="no-reports">Keine Berichte vorhanden.</p>
            </div>
        </section>

    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Denis Protokoll - Security Reporting Tool</p>
    </footer>

    <script src="app.js"></script>
    <script>
        // تسجيل الـ Service Worker لتفعيل خاصية الـ PWA والعمل بدون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registriert!', reg))
                    .catch(err => console.error('Service Worker Fehler:', err));
            });
        }
    </script>
</body>
</html>
